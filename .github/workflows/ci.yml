name: Sales Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create config.yaml
        run: |
          cat > config.yaml << EOF
          paths:
            raw_data: data/raw
            processed_data: data/processed
            invalid_data: data/invalid
            database: sales_dw.db
          aws:
            access_key_id: dummy
            secret_access_key: dummy
            bucket_name: dummy
            region: us-east-1
          EOF

      - name: Create sample data for tests
        run: |
          mkdir -p data/raw data/processed data/invalid

      - name: Run tests
        run: |
          pytest tests/test_pipeline.py -v